<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Our Love Map 📍 Mapping Every Date & Memory Together</title>
    
    <script src="api.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        themeMain: '#38bdf8',  
                        themePink: '#f43f5e',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        cute: ['"Varela Round"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f0f9ff; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }
        
        .view-section { display: none; height: 100%; width: 100%; position: relative; }
        .view-section.active { display: flex; flex-direction: column; }

        #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; width: 100%; height: 100%; background: #e5e5e5; }
        
        .heart-marker { color: #f43f5e; font-size: 38px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); transition: transform 0.3s; }
        .heart-marker:hover { transform: scale(1.3) translateY(-5px); }
        .heart-icon-div { width: 38px !important; height: 38px !important; display: flex !important; align-items: center; justify-content: center; background: transparent; border: none; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .search-scroll::-webkit-scrollbar { width: 4px; }
        .search-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        #loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 9999; align-items: center; justify-content: center; }

        .leaflet-popup-content-wrapper { padding: 0; border-radius: 16px; box-shadow: 0 20px 40px -5px rgba(0,0,0,0.2); }
        .leaflet-popup-content { margin: 0 !important; width: 100% !important; }
        .leaflet-popup-content p { margin: 0 !important; }
        .leaflet-container a.leaflet-popup-close-button { top: 12px; right: 12px; color: #94a3b8; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; border-radius: 50%; z-index: 20; }

        /* Mobile Sheet */
        .mobile-sheet {
            position: absolute; height: 280px; 
            left: 20px; right: 20px; 
            bottom: 80px; 
            background: rgba(255, 255, 255, 0.45); border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); z-index: 20; display: flex; flex-direction: column; transition: height 0.3s ease;
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute; 
            bottom: 380px; 
            left: 50%; transform: translateX(-50%); z-index: 40; 
            display: flex; align-items: center; gap: 12px; padding: 8px 16px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 999px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); border: 1px solid rgba(200,200,200,0.4); 
            transition: all 0.3s ease-out; min-width: 220px; justify-content: space-between;
        }
        #mobile-controls.hidden-fade { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(20px); }
        #mobile-controls button { width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #475569; font-size: 18px; transition: all 0.2s; flex-shrink: 0; }
        #mobile-controls button:hover { background-color: #f1f5f9; color: #38bdf8; }
        #mobile-controls .divider { width: 1px; height: 28px; background: #e2e8f0; margin: 0; }
        
        /* Search */
        #custom-search-wrapper { max-width: 0; opacity: 0; overflow: hidden; transition: max-width 0.3s ease-out, opacity 0.2s ease-out; display: flex; align-items: center; }
        #custom-search-wrapper.expanded { max-width: 310px; opacity: 1; }
        #custom-search-input { width: 100%; height: 36px; background: transparent; color: #334155; border: none; outline: none; padding: 0 8px 0 4px; font-size: 15px; }
        #search-results { position: absolute; bottom: 100%; left: 0; width: 100%; margin-bottom: 12px; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); border-radius: 12px; border: 1px solid #e2e8f0; max-height: 250px; overflow-y: auto; display: none; padding: 4px 0; color: #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 50; }
        #search-results li { padding: 12px 16px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
        #search-results li:hover { background: #f0f9ff; color: #38bdf8; }
        .controls-group { display: flex; align-items: center; gap: 12px; overflow: hidden; max-width: 200px; transition: max-width 0.3s ease; }
        .controls-group.hidden-force { max-width: 0; opacity: 0; pointer-events: none; }

        /* Card Styles */
        .cute-card { 
            background: white; border: 1px solid #e2e8f0; transition: all 0.25s ease-out; position: relative; overflow: hidden; border-radius: 0.75rem;
            min-height: 165px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .cute-card:hover { background-color: #f0f9ff; border-color: #bae6fd; z-index: 10; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.1); }
        .tab-btn { transition: all 0.2s; border-radius: 99px; border: 2px solid transparent; }
        .tab-btn.boy.active { background: #dbeafe; color: #2563eb; border-color: #2563eb; }
        .tab-btn.girl.active { background: #ffe4e6; color: #e11d48; border-color: #e11d48; }

        /* Diary Styles */
        .diary-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #f1f5f9; position: relative; }
        
        /* 滾動式多圖 (Popup) */
        .scrolling-images { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 12px; scroll-snap-type: x mandatory; padding-bottom: 4px; }
        .scrolling-img-item { flex: 0 0 100%; scroll-snap-align: start; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; cursor: pointer; }
        .scrolling-images.multi .scrolling-img-item { flex: 0 0 85%; }
        .scrolling-img-item img { width: 100%; height: 100%; object-fit: cover; }
        /* 影片預覽容器 */
        .scrolling-img-item video, .grid-img-item {
            background: #eee;
        }

        /* 網格縮圖 (Card - 5列) */
        .grid-images-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px; }
        .grid-img-item { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; cursor: pointer; }

        /* 預覽容器 (上傳時) */
        .preview-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .preview-img-wrapper { width: 60px; height: 60px; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; position: relative; }
        .preview-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .preview-remove-btn { position: absolute; inset: 0; background: rgba(0,0,0,0.5); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.2s; }
        .preview-img-wrapper:hover .preview-remove-btn { opacity: 1; }

        /* 雲端選擇器 1:1 方格 */
        #drive-selector-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        /* 雲端選擇器項目 */
        .drive-file-item {
            width: 100%;
            aspect-ratio: 1 / 1 !important;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #f1f5f9;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }

        /* .drive-file-item.selected {
            border-color: #38bdf8;
            transform: scale(0.95);
        } */

        /* 影片隱藏與顯示的動畫 */
        .video-hidden {
            opacity: 0;
        }
        .video-visible {
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        /* 覆蓋媒體容器樣式，確保 1:1 */
        .drive-file-item .media-container {
            width: 100%;
            height: 100%;
        }

        /* 影片標籤樣式 */
        .video-indicator {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 2px 4px;
            border-radius: 3px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
            pointer-events: none;
        }
        /* 確保雲端選擇器內的 media-loader 尺寸縮小一點 */
        .drive-file-item .media-loader {
            font-size: 10px;
            background: #f1f5f9;
        }

        .drive-file-item .media-loader i {
            font-size: 14px;
            margin-bottom: 2px;
        }

        /* 確保影片在卡片中不顯示控制項 */
        video::-webkit-media-controls {
            display:none !important;
        }

        /* 讓卡片中的圖片/影片也保持比例 */
        .grid-img-item, .grid-video-item {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 4px;
        }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; items-center; z-index: 100; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; font-size: 10px; cursor: pointer; transition: all 0.2s; }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        .nav-item.active { color: #38bdf8; }

        /* Lightbox */
        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; }
        #lightbox img { max-width: 100%; max-height: 80vh; object-fit: contain; }
        .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); color: white; font-size: 30px; padding: 20px; cursor: pointer; z-index: 3001; }
        .lightbox-prev { left: 10px; }
        .lightbox-next { right: 10px; }

        @media (min-width: 768px) {
            .mobile-sheet { position: static; width: 25%; height: 100%; background: white; border-radius: 0; box-shadow: none; border-right: 1px solid #e2e8f0; z-index: 20; margin: 0; overflow: hidden; }
            #map-container { position: relative; width: 75%; height: 100%; }
            #mobile-controls { bottom: 24px; left: 50%; transform: translateX(-50%); }
            .bottom-nav { display: none; }
            .diary-container { max-width: 600px; margin: 0 auto; padding-top: 20px; }
            .cute-card { min-height: 0; display: block; }
        }
    </style>
    <link rel="stylesheet" href="main.css">
    
</head>
<body class="text-slate-600 font-sans">

    <div id="loading-overlay" class="hidden flex">
        <div class="flex flex-col items-center">
            <i class="fa-solid fa-heart fa-beat text-5xl text-themePink mb-4"></i>
            <p class="text-slate-500 font-bold tracking-widest text-sm">LOADING MAP...</p>
        </div>
    </div>

    <!-- Lightbox 結構 -->
    <div id="lightbox" class="hidden fixed inset-0 bg-black/95 z-[3000] flex flex-col items-center justify-center">
        <!-- 關閉按鈕 -->
        <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white text-3xl z-[3001] p-2 hover:text-themeMain transition">
            <i class="fa-solid fa-xmark"></i>
        </button>
        
        <!-- 左右導航 -->
        <div class="lightbox-nav lightbox-prev" onclick="changeSlide(-1)"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="lightbox-nav lightbox-next" onclick="changeSlide(1)"><i class="fa-solid fa-chevron-right"></i></div>
        
        <!-- 媒體顯示區 (關鍵：保持 ID 穩定) -->
        <div id="lightbox-content-wrapper" class="relative flex items-center justify-center w-full h-full p-4">
            <!-- 圖片標籤永遠存在 -->
            <img id="lightbox-img" src="" alt="Full view" class="max-w-full max-h-[80vh] object-contain hidden">
            <!-- 影片標籤將會動態插入到這裡，ID 設為 lightbox-video -->
        </div>
        
        <!-- 計數器 -->
        <div class="absolute bottom-6 text-white text-sm tracking-widest font-bold bg-black/50 px-4 py-1 rounded-full" id="lightbox-counter">1 / 1</div>
    </div>

    <!-- Drive File Selector Modal -->
    <div id="drive-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[3000] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md h-[500px] flex flex-col overflow-hidden relative animate-[fadeIn_0.2s_ease-out]">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-700">Select from Drive</h3>
                <button onclick="closeDriveModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="drive-selector-list" class="p-4 flex-1 overflow-y-auto no-scrollbar">
                <!-- Drive files will be injected here -->
            </div>
            <div class="p-4 border-t flex justify-end">
                <button onclick="confirmDriveSelection()" class="px-6 py-2 bg-themeMain text-white rounded-xl font-bold hover:bg-sky-500 transition">Confirm</button>
            </div>
        </div>
    </div>

    <!-- ===== View 1: Map ===== -->
    <div id="view-map" class="view-section active">
        <nav class="absolute top-4 left-4 right-4 h-14 bg-white/90 backdrop-blur-md rounded-full shadow-lg z-30 flex items-center justify-between px-5 md:hidden">
            <div class="flex items-center gap-2"><i class="fa-solid fa-heart text-themePink text-xl"></i><h1 class="text-lg font-bold text-slate-700 font-cute">Our Love Map</h1></div>
            <div class="flex gap-2"><button onclick="fetchData('map')" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-themeMain hover:text-white transition"><i class="fa-solid fa-rotate-right"></i></button></div>
        </nav>
        <nav class="hidden md:flex bg-white border-b border-slate-200 h-16 items-center justify-between px-6 z-30 shadow-sm relative">
            <div class="flex items-center gap-2"><i class="fa-solid fa-heart text-themePink text-2xl"></i><h1 class="text-xl font-bold text-slate-700 font-cute">Our Love Map<small>📍 Mapping Every Date & Memory Together</small></h1></div>
            <div class="flex gap-3"><button onclick="switchView('map')" class="px-4 py-1.5 rounded-lg bg-themeMain text-white font-bold">地圖</button><button onclick="switchView('diary')" class="px-4 py-1.5 rounded-lg bg-slate-100 hover:bg-themeMain hover:text-white transition font-bold text-slate-500">日記</button></div>
        </nav>
        <div class="flex-1 flex flex-col md:flex-row h-full relative overflow-hidden">
            <aside class="mobile-sheet">
                <div class="w-full flex justify-center pt-3 pb-1 md:hidden" onclick="toggleSheet()"><div class="w-10 h-1.5 bg-slate-300 rounded-full"></div></div>
                <div class="px-5 py-2 border-b border-slate-100/50 flex justify-between items-end">
                    <div class="flex items-center gap-2"><i class="fa-solid fa-images text-themeMain text-lg"></i><h2 class="font-bold text-slate-700 text-lg">回憶相簿</h2></div>
                    <span class="text-xs bg-themePink text-white px-3 py-1 rounded-full font-bold" id="map-count-display">0</span>
                </div>
                <div id="location-list" class="flex-1 overflow-y-auto no-scrollbar px-5 py-2 pb-24 md:block md:p-0 md:px-6 md:py-4 md:space-y-0 grid grid-cols-1 gap-4 md:gap-4"></div>
            </aside>
            <section id="map-container" class="w-full h-full relative">
                <div id="map"></div>
                <div id="mobile-controls" class="absolute z-[40]">
                    <ul id="search-results" class="search-scroll"></ul>
                    <button id="search-toggle-btn" onclick="toggleCustomSearch(event)" class="hover:bg-slate-100 transition active:scale-95"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <div id="custom-search-wrapper" class="flex-1 max-w-0 opacity-0 overflow-hidden transition-all duration-300"><input type="text" id="custom-search-input" placeholder="搜尋地點..." class="w-full h-full bg-transparent text-slate-700 placeholder-slate-400 border-none outline-none px-2 text-base"></div>
                    <div id="controls-group" class="controls-group flex items-center"><div class="divider"></div><button onclick="map.zoomOut()" class="hover:bg-slate-100 transition active:scale-95"><i class="fa-solid fa-minus"></i></button><button onclick="map.zoomIn()" class="hover:bg-slate-100 transition active:scale-95"><i class="fa-solid fa-plus"></i></button><div class="divider"></div><button onclick="fitAllMarkers()" class="hover:bg-themeMain hover:text-white transition active:scale-95"><i class="fa-solid fa-expand"></i></button></div>
                </div>
            </section>
        </div>
    </div>

    <!-- View 2: Diary -->
    <div id="view-diary" class="view-section bg-slate-50 overflow-y-auto pb-24">
        <nav class="sticky top-0 bg-white/90 backdrop-blur-md border-b border-slate-200 h-16 md:h-20 flex items-center justify-between px-5 md:px-6 z-30 shadow-sm py-2">
            <div class="flex items-center gap-2"><i class="fa-solid fa-book-open text-themeMain text-xl"></i><h1 class="text-lg md:text-xl font-bold text-slate-700">每日日記</h1></div>
            <div class="hidden md:flex gap-3"><button onclick="switchView('map')" class="px-4 py-1.5 rounded-lg bg-slate-100 hover:bg-themeMain hover:text-white transition font-bold text-slate-500">地圖</button><button onclick="switchView('diary')" class="px-4 py-1.5 rounded-lg bg-themeMain text-white font-bold">日記</button></div>
            <button onclick="openDiaryModal('add')" class="md:hidden w-10 h-10 rounded-full bg-themeMain text-white flex items-center justify-center shadow-lg"><i class="fa-solid fa-plus text-lg"></i></button>
            <button onclick="openDiaryModal('add')" class="hidden md:block px-4 py-1.5 rounded-lg bg-themeMain text-white font-bold shadow hover:bg-sky-500 transition"><i class="fa-solid fa-pen-fancy mr-2"></i>寫日記</button>
        </nav>
        <div class="diary-container px-4 py-6" id="diary-list"></div>
    </div>

    <div class="bottom-nav md:hidden">
        <div class="nav-item active" onclick="switchView('map')"><i class="fa-solid fa-map-location-dot"></i><span>地圖</span></div>
        <div class="nav-item" onclick="switchView('diary')"><i class="fa-solid fa-book-journal-whills"></i><span>日記</span></div>
    </div>

    <!-- Map Modal -->
    <div id="data-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[2000] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all scale-100 relative animate-[fadeIn_0.2s_ease-out]">
            <button onclick="closeModal('data-modal')" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center bg-slate-100 rounded-full text-slate-400 hover:bg-slate-200 transition"><i class="fa-solid fa-xmark"></i></button>
            <div class="p-6 max-h-[90vh] overflow-y-auto no-scrollbar">
                <h3 class="font-bold text-xl text-slate-800 mb-5 flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-themePink/10 flex items-center justify-center text-themePink"><i class="fa-solid fa-pen-nib"></i></div><span id="modal-title">Write Memory</span></h3>
                <form id="data-form" class="space-y-4">
                    <input type="hidden" id="entry-id"><input type="hidden" id="entry-lat"><input type="hidden" id="entry-lng">
                    <!-- Image Input for Map -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-2 ml-1 uppercase">Photos (Multiple)</label>
                        <div class="flex gap-2">
                            <input type="file" id="entry-image" accept="image/*" multiple class="hidden" onchange="previewMapImages(this)">
                            <div class="flex-1 border-2 border-dashed border-slate-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:border-themeMain transition text-slate-400" onclick="document.getElementById('entry-image').click()">
                                <i class="fa-solid fa-upload text-xl"></i><span class="text-[10px] font-bold">上傳</span>
                            </div>
                            <div class="flex-1 border-2 border-dashed border-slate-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:border-themeMain transition text-slate-400" onclick="openDriveSelector('map')">
                                <i class="fa-brands fa-google-drive text-xl"></i><span class="text-[10px] font-bold">Drive</span>
                            </div>
                        </div>
                        <div id="map-preview-container" class="preview-grid mt-2"></div>
                    </div>
                    <div><label class="block text-xs font-bold text-slate-400 mb-1 ml-1 uppercase">Location</label><input type="text" id="entry-name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 font-bold focus:ring-2 focus:ring-themeMain focus:border-transparent outline-none transition"></div>
                    <div><label class="block text-xs font-bold text-slate-400 mb-1 ml-1 uppercase">Date</label><input type="date" id="entry-date" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-600 focus:ring-2 focus:ring-themeMain focus:border-transparent outline-none transition"></div>
                    <div class="bg-slate-50 p-1 rounded-xl flex gap-1">
                        <button type="button" onclick="switchTab('boy', 'panel-boy', 'panel-girl', this)" class="tab-btn boy flex-1 py-2 text-sm text-slate-400 font-bold"><i class="fa-solid fa-mars mr-1"></i> 男友</button>
                        <button type="button" onclick="switchTab('girl', 'panel-boy', 'panel-girl', this)" class="tab-btn girl flex-1 py-2 text-sm text-slate-400 font-bold"><i class="fa-solid fa-venus mr-1"></i> 女友</button>
                    </div>
                    <div id="panel-boy" class="hidden"><textarea id="entry-note-boy" rows="4" placeholder="寫下你的心情..." class="w-full bg-blue-50/50 rounded-xl border border-blue-100 p-4 text-sm text-slate-700 outline-none focus:ring-2 focus:ring-blue-200 resize-none"></textarea></div>
                    <div id="panel-girl" class="hidden"><textarea id="entry-note-girl" rows="4" placeholder="寫下妳的心情..." class="w-full bg-pink-50/50 rounded-xl border border-pink-100 p-4 text-sm text-slate-700 outline-none focus:ring-2 focus:ring-pink-200 resize-none"></textarea></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gifshot-plus@1.0.2/dist/gifshot.min.js"></script>
    <script>
        // const API_URL = "YOUR_GAS_URL"; // Defined in api.js

        let map;
        let markers = [];
        let spots = [];
        let diaries = [];
        let currentTab = 'boy';
        let isSheetExpanded = false;
        let searchTimeout; 
        let tempSearchMarker;
        let currentView = 'map';
        
        let currentMapImages = []; 
        let currentDiaryAuthor = 'boy';
        let currentDiaryImages = []; 
        let lightboxImages = [];
        let lightboxIndex = 0;
        let driveTarget = '';

        // 點擊按鈕時，不再直接操作 DOM，而是改變網址的 Hash
        function switchView(view) {
            window.location.hash = view;
        }

        // 監聽並處理 Hash 改變的事件
        function handleHashChange() {
            // 取得當前的 hash，如果沒有或不合法，預設改為 'map'
            let view = window.location.hash.replace('#', '');
            if (view !== 'map' && view !== 'diary') {
                window.location.hash = 'map';
                return; // 改變 hash 會再次觸發此函式，因此先 return
            }
            
            currentView = view;
            
            // 切換視圖 (View) 的顯示狀態
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${view}`).classList.add('active');
            
            // 切換下方導覽列 (Bottom Nav) 的 Active 狀態
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            if(view === 'map') {
                document.querySelector('.nav-item:nth-child(1)').classList.add('active');
                if(map) setTimeout(() => map.invalidateSize(), 100);
                fetchData('map');
            } else {
                document.querySelector('.nav-item:nth-child(2)').classList.add('active');
                fetchData('diary');
            }
        }
        // 註冊 hashchange 監聽器
        window.addEventListener('hashchange', handleHashChange);
        /**
         * 透過結構化的 type 欄位判斷是否為影片
         */
        function isVideo(item) {
            if (!item) return false;
    
            // 1. 新版物件格式判斷
            if (typeof item === 'object' && item !== null) {
                return item.type === 'video';
            }
            
            // 2. 舊版字串格式判斷 (備案)
            const src = String(item);
            return src.includes('video') || 
                src.includes('preview') || 
                src.match(/\.(mp4|webm|mov|quicktime)/i);
        }
        /**
         * 將 Google Drive 連結轉換為更穩定、支援串流的格式
         */
        function getStreamableUrl(url) {
            if (!url) return "";
            // 如果是 Base64 直接回傳
            if (url.startsWith('data:')) return url;
            
            // 提取 Google Drive ID
            const match = url.match(/[-\w]{25,}/);
            if (match && (url.includes('google.com') || url.includes('googleusercontent.com'))) {
                const fileId = match[0];
                // 使用 Google Drive 的直接下載/串流網址
                return `https://drive.google.com/uc?id=${fileId}&export=preview`;
            }
            return url;
        }

        // 影片壓縮與剪輯核心：產生 2 秒低畫質預覽
        async function createVideoPreview(file) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.src = URL.createObjectURL(file);
                video.muted = true;
                video.playsInline = true;

                video.onloadedmetadata = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 設定極低解析度 (320px 寬) 達到壓縮目的
                    const scale = 320 / video.videoWidth;
                    canvas.width = 320;
                    canvas.height = video.videoHeight * scale;

                    const stream = canvas.captureStream(15); // 15 FPS
                    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 100000 }); // 極低碼率
                    const chunks = [];

                    recorder.ondataavailable = (e) => chunks.push(e.data);
                    recorder.onstop = async () => {
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(blob);
                        URL.revokeObjectURL(video.src);
                    };

                    video.play();
                    recorder.start();

                    // 繪製循環：每影格畫入 canvas
                    const draw = () => {
                        if (video.paused || video.ended) return;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        requestAnimationFrame(draw);
                    };
                    draw();

                    // 2 秒後停止錄製
                    setTimeout(() => {
                        recorder.stop();
                        video.pause();
                    }, 2000);
                };
            });
        }
        // 修改原有的 processFile
        async function processFile(file, callback) {
            if (file.type.startsWith('video/')) {
                showLoading(true);
                
                // 同步執行：原片壓縮與 GIF 同時開始
                const [fullRes, thumbRes] = await Promise.all([
                    compressVideo(file, { width: 720 }), // 原片稍微降一點解析度到 720p 提高速度
                    new Promise((resolve) => {
                        gifshot.createGIF({
                            video: [URL.createObjectURL(file)],
                            numFrames: 12,      // 降低影格數 (由 20 降到 12)，合成速度快一倍
                            gifWidth: 240,      // 縮小預覽圖尺寸
                            gifHeight: 240,
                            interval: 0.15,     // 稍微拉大間隔
                            sampleInterval: 20, // 降低抽樣精密度以換取速度
                        }, (obj) => resolve(obj.error ? null : obj.image));
                    })
                ]);

                showLoading(false);
                callback({ full: fullRes, thumb: thumbRes, type: 'video' });
            } else {
                processImage(file, callback); 
            }
        }
        // 影片壓縮核心：產出指定解析度與長度的影片
        async function compressVideo(file, options = { width: 640, duration: null }) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.src = URL.createObjectURL(file);
                video.muted = true;
                video.playsInline = true;

                video.onloadedmetadata = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 計算比例
                    const scale = options.width / video.videoWidth;
                    canvas.width = options.width;
                    canvas.height = video.videoHeight * scale;

                    const stream = canvas.captureStream(24); // 24 FPS
                    const recorder = new MediaRecorder(stream, { 
                        mimeType: 'video/webm;codecs=vp8', 
                        videoBitsPerSecond: options.duration ? 100000 : 800000 // 預覽用極低碼率，原片用中等碼率
                    });

                    const chunks = [];
                    recorder.ondataavailable = (e) => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(blob);
                        URL.revokeObjectURL(video.src);
                    };

                    video.play();
                    recorder.start();

                    const draw = () => {
                        if (video.paused || video.ended) return;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        requestAnimationFrame(draw);
                    };
                    draw();

                    // 如果有設定長度（預覽），則定時停止；否則播放到底（原片）
                    if (options.duration) {
                        setTimeout(() => { recorder.stop(); video.pause(); }, options.duration);
                    } else {
                        video.onended = () => recorder.stop();
                    }
                };
            });
        }

        // 修改地圖上傳預覽
        async function previewMapImages(input) {
            if (input.files) {
                // 使用 for...of 處理 async，確保順序並顯示 Loading
                showLoading(true);
                for (const file of input.files) {
                    await new Promise((resolve) => {
                        processFile(file, (data) => {
                            currentMapImages.push(data);
                            resolve();
                        });
                    });
                }
                renderMapPreview();
                showLoading(false);
            }
        }

        function renderMapPreview() {
            const previewDiv = document.getElementById('map-preview-container');
            previewDiv.innerHTML = '';
            
            currentMapImages.forEach((item, index) => {
                const isVid = isVideo(item);
                const displaySrc = getSource(item, 'thumb'); 
                
                // 判斷是否為雲端來源影片，或者是剛剛產出的 GIF
                const isCloudVid = (typeof item === 'object' && item.isCloud);
                const isGif = (typeof displaySrc === 'string' && displaySrc.startsWith('data:image/gif')) || (displaySrc && displaySrc.includes('.gif'));

                let mediaHtml = "";

                if (isVid || isCloudVid) {
                    // 雲端影片或 GIF：使用 <img> 標籤預覽 (最穩定)
                    mediaHtml = `
                        <img src="${displaySrc}" class="w-full h-full object-cover">
                        <div class="video-indicator"><i class="fa-solid fa-play text-[10px]"></i></div>
                    `;
                } else {
                    // 純圖片
                    mediaHtml = `<img src="${displaySrc}" class="w-full h-full object-cover">`;
                }

                const imgDiv = document.createElement('div');
                imgDiv.className = "preview-img-wrapper relative group";
                imgDiv.innerHTML = `
                    ${mediaHtml}
                    <div class="preview-remove-btn" onclick="removeMapImage(${index})">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </div>
                `;
                previewDiv.appendChild(imgDiv);
            });
        }

        function removeMapImage(index) {
            currentMapImages.splice(index, 1);
            renderMapPreview();
        }

        // Diary Image Preview (Multi)
        async function previewMultiImages(input) {
            if (input.files) {
                showLoading(true);
                for (const file of input.files) {
                    await new Promise((resolve) => {
                        processFile(file, (data) => {
                            currentDiaryImages.push(data);
                            resolve();
                        });
                    });
                }
                renderDiaryPreview();
                showLoading(false);
            }
        }

        function renderDiaryPreview() {
            const container = document.getElementById('diary-preview-container');
            container.innerHTML = '';
            
            currentDiaryImages.forEach((item, index) => {
                // 使用 getSource 判斷，不管是物件還是字串都能拿到 URL
                const displaySrc = getSource(item, 'thumb');
                const isVid = isVideo(item);
                
                const mediaHtml = isVid 
                    ? `<div class="relative w-full h-full">
                        <img src="${displaySrc}" class="w-full h-full object-cover">
                        <div class="video-indicator"><i class="fa-solid fa-play text-[8px]"></i></div>
                    </div>`
                    : `<img src="${displaySrc}" class="w-full h-full object-cover">`;

                const imgDiv = document.createElement('div');
                imgDiv.className = "preview-img-wrapper relative group";
                imgDiv.innerHTML = `
                    ${mediaHtml}
                    <div class="preview-remove-btn" onclick="removeDiaryImage(${index})"><i class="fa-solid fa-trash"></i></div>
                `;
                container.appendChild(imgDiv);
            });
        }
        function removeDiaryImage(index) {
            currentDiaryImages.splice(index, 1);
            renderDiaryPreview();
        }

        // 修正雲端選擇器載入與選擇邏輯
        async function openDriveSelector(target) {
            driveTarget = target;
            const modal = document.getElementById('drive-modal');
            const list = document.getElementById('drive-selector-list');
            
            modal.classList.remove('hidden');
            list.innerHTML = `<div class="col-span-12 w-full flex flex-col items-center justify-center py-20 text-slate-400">
                <i class="fa-solid fa-sync fa-spin text-2xl mb-2"></i><p>讀取雲端相簿...</p>
            </div>`;

            try {
                const response = await fetch(`${API_URL}?action=list_drive_files`);
                const files = await response.json();
                list.innerHTML = '';
                
                files.forEach((file) => {
                    const div = document.createElement('div');
                    div.className = 'drive-file-item';
                    div.dataset.raw = JSON.stringify(file); // 暫存整筆資料
                    div.innerHTML = `
                        <img src="${file.gifUrl || file.url}" class="w-full h-full object-cover">
                        ${file.mime.includes('video') ? '<div class="video-indicator"><i class="fa-solid fa-play"></i></div>' : ''}
                    `;
                    div.onclick = function() { this.classList.toggle('selected'); };
                    list.appendChild(div);
                });
            } catch (e) {
                list.innerHTML = '<div class="col-span-3 text-center py-20 text-red-400">載入失敗</div>';
            }
        }

        function closeDriveModal() { document.getElementById('drive-modal').classList.add('hidden'); }

        // 修正確認選擇邏輯
        function confirmDriveSelection() {
            const selected = document.querySelectorAll('.drive-file-item.selected');
            selected.forEach(el => {
                const fileData = JSON.parse(el.dataset.raw);
                const isVid = fileData.mime.includes('video');

                let itemToPush;
                if (isVid) {
                    itemToPush = { 
                        full: fileData.iframeUrl, 
                        thumb: fileData.gifUrl,
                        type: "video"
                    };
                } else {
                    // 圖片也存成標準物件，方便 GAS 辨識
                    itemToPush = {
                        full: fileData.url,
                        type: "image"
                    };
                }
                
                // 檢查重複並推入 (略)
                const targetArray = (driveTarget === 'map') ? currentMapImages : currentDiaryImages;
                const exists = targetArray.some(img => (typeof img === 'object' ? img.full : img) === itemToPush.full);
                if (!exists) targetArray.push(itemToPush);
            });
            
            if (driveTarget === 'map') renderMapPreview();
            else renderDiaryPreview();
            closeDriveModal();
        }

        function processImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 1206;
                    let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
            reader.readAsDataURL(file);
        }

        function openLightbox(images, index) {
            lightboxImages = images; lightboxIndex = index; updateLightbox();
            document.getElementById('lightbox').classList.remove('hidden');
            document.getElementById('lightbox').classList.add('flex');
        }
        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
            
            // 關鍵：停止並移除影片，防止關閉後聲音繼續播放
            const video = document.getElementById('lightbox-video');
            if (video) {
                if (video.tagName === 'VIDEO') {
                    video.pause();
                    video.src = "";
                }
                video.remove();
            }
        }
        function changeSlide(step) {
            lightboxIndex += step;
            if (lightboxIndex < 0) lightboxIndex = lightboxImages.length - 1;
            if (lightboxIndex >= lightboxImages.length) lightboxIndex = 0;
            updateLightbox();
        }
        // 修改 Lightbox (這裡要用 full 原片)
        function updateLightbox() {
            const img = document.getElementById('lightbox-img');
            const wrapper = document.getElementById('lightbox-content-wrapper');
            const counter = document.getElementById('lightbox-counter');
            
            // 移除舊的影片/Iframe
            const oldMedia = document.getElementById('lightbox-video');
            if (oldMedia) oldMedia.remove();

            const item = lightboxImages[lightboxIndex];
            const fullPath = getSource(item, 'full');

            // 直接使用 item.type 判斷
            if (isVideo(item)) {
                img.classList.add('hidden');

                const iframe = document.createElement('iframe');
                iframe.id = 'lightbox-video';
                // 確保連結是預覽格式
                iframe.src = fullPath.includes('preview') ? fullPath : convertToIframeUrl(fullPath);
                iframe.className = "w-[95vw] h-[60vh] md:w-[1200px] md:h-[675px] rounded-2xl border-none shadow-2xl bg-black";
                iframe.allow = "autoplay; fullscreen";
                
                wrapper.appendChild(iframe);
            } else {
                img.src = fullPath;
                img.classList.remove('hidden');
            }

            if (counter) counter.innerText = `${lightboxIndex + 1} / ${lightboxImages.length}`;
        }
        function convertToIframeUrl(url) {
            if (url.includes('preview')) return url;
            const match = url.match(/[-\w]{25,}/);
            if (match) {
                return `https://drive.google.com/file/d/${match[0]}/preview`;
            }
            return url;
        }
        /**
         * 備案：如果原生播放器失敗，改用 Google Drive 的 Iframe 預覽器
         */
         function switchToIframe(videoElement, originalUrl) {
            const match = originalUrl.match(/[-\w]{25,}/);
            if (match) {
                const fileId = match[0];
                const iframe = document.createElement('iframe');
                iframe.id = 'lightbox-video'; // 使用相同 ID 方便下一張切換時清理
                iframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
                iframe.className = "w-[90vw] h-[60vh] md:w-[800px] md:h-[500px] rounded-xl border-none";
                iframe.allow = "autoplay";
                
                const parent = videoElement.parentNode;
                videoElement.remove();
                parent.appendChild(iframe);
            }
        }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function showLoading(show) { document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none'; }

        async function fetchData(type) {
            // 如果是切換分頁，且已經有資料了，就不要顯示全螢幕 Loading
            const hasData = (type === 'map' ? spots.length : diaries.length) > 0;
            if (!hasData) showLoading(true);

            try {
                const response = await fetch(`${API_URL}?action=read&type=${type}&t=${Date.now()}`);
                const data = await response.json();
                
                if (type === 'map') {
                    spots = data;
                    renderMapAll();
                } else {
                    diaries = data;
                    renderDiaryAll();
                }
            } catch (error) {
                console.error("讀取失敗", error);
            } finally {
                showLoading(false);
            }
        }

        async function sendData(action, type, data, modalId) {
            showLoading(true);
            try {
                const payload = { ...data, type: type };
                const response = await fetch(`${API_URL}?action=${action}`, {
                    method: 'POST', body: JSON.stringify(payload), headers: { "Content-Type": "text/plain;charset=utf-8" }
                });
                const result = await response.json();
                if (result.status === "success") { await fetchData(type); if(modalId) closeModal(modalId); } 
                else { throw new Error(result.message); }
            } catch (error) { alert("儲存失敗：" + error.message); }
            finally { showLoading(false); }
        }

        function flyToSpot(lat, lng, callback) {
            const targetZoom = 16;
            const mapHeight = map.getSize().y;
            map.closePopup();
            const isMobile = window.innerWidth < 768;
            const offsetRatio = isMobile ? 0.1 : 0; 
            const point = map.project([lat, lng], targetZoom);
            const targetPoint = L.point(point.x, point.y - (mapHeight * offsetRatio)); 
            const newCenter = map.unproject(targetPoint, targetZoom);
            const dist = map.distance(map.getCenter(), newCenter);
            if (dist < 50) { if (callback) callback(); return; }
            map.flyTo(newCenter, targetZoom, { animate: true, duration: 0.6 });
            map.once('moveend', function() { setTimeout(() => { if (callback) callback(); }, 150); });
        }
        
        function fitAllMarkers() {
            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));

        }

        function getHeartIcon() { return L.divIcon({ className: 'heart-icon-div', html: '<i class="fa-solid fa-heart heart-marker"></i>', iconSize: [38, 38], iconAnchor: [19, 36], popupAnchor: [0, -40] }); }
        /**
         * 安全取得圖片來源
         */
        function getSource(item, sourceType = 'thumb') {
            if (!item) return "";
            if (typeof item === 'object') {
                // 如果是影片，thumb 存在就用 thumb，否則用 full
                if (item.type === 'video') {
                    return sourceType === 'full' ? item.full : (item.thumb || item.full);
                }
                return item.full; // 圖片
            }
            return item; // 舊字串資料
        }
        // 修改生成媒體標籤的函式
        function getMediaTag(item, className = "", onClickHtml = "") {
            const isVid = isVideo(item);
            const thumbSrc = getSource(item, 'thumb'); 
            
            if (isVid) {
                return `
                    <div class="media-container ${className}">
                        <!-- 直接使用 GIF <img> 標籤 -->
                        <img 
                            src="${thumbSrc}" 
                            class="w-full h-full object-cover" 
                            ${onClickHtml} 
                            onerror="this.src='https://placehold.co/100?text=Video'"
                            loading="lazy">
                        <div class="video-indicator"><i class="fa-solid fa-play text-[9px]"></i></div>
                    </div>`;
            } else {
                return `<img src="${thumbSrc}" class="${className}" ${onClickHtml} loading="lazy">`;
            }
        }
        // 當影片真正開始播放時觸發
        function handleMediaReady(id) {
            const video = document.getElementById(id);
            const loader = document.getElementById('loader_' + id);
            if (video && loader) {
                video.classList.remove('video-hidden');
                video.classList.add('video-visible');
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 300);
            }
        }
        // 處理影片載入失敗 (Google Drive 處理中)
        function handleMediaError(id, src) {
            const loader = document.getElementById('loader_' + id);
            if (loader) {
                loader.innerHTML = '<i class="fa-solid fa-clock text-[10px]"></i>';
            }
            // 每 10 秒重試一次
            setTimeout(() => {
                const video = document.getElementById(id);
                if (video) {
                    video.src = src + (src.includes('?') ? '&' : '?') + "t=" + new Date().getTime();
                    video.load();
                }
            }, 10000);
        }

                            </div>
                            <input type="text" id="input-${diary.id}" class="comment-input" placeholder="留個言吧...">
                            <button onclick="addComment('${diary.id}')" class="w-8 h-8 rounded-full bg-themeMain text-white flex items-center justify-center shadow-sm active:scale-90 transition flex-shrink-0">
                                <i class="fa-solid fa-paper-plane text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openDiaryModal(mode, id) {
            const modal = document.getElementById('diary-modal'); modal.classList.remove('hidden');
            document.getElementById('diary-preview-container').innerHTML = ``;
            currentDiaryImages = [];
            if (mode === 'add') {
                document.getElementById('diary-modal-title').innerText = "New Diary"; document.getElementById('diary-form').reset();
                document.getElementById('diary-id').value = ''; document.getElementById('diary-date').valueAsDate = new Date(); setDiaryAuthor('boy');
            } else {
                const diary = diaries.find(d => d.id == id); document.getElementById('diary-modal-title').innerText = "Edit Diary";
                document.getElementById('diary-id').value = diary.id; document.getElementById('diary-date').value = diary.date; document.getElementById('diary-content').value = diary.content; setDiaryAuthor(diary.author || 'boy');
                if(diary.images && diary.images.length > 0) {
                    currentDiaryImages = diary.images; const container = document.getElementById('diary-preview-container'); container.innerHTML = '';
                    diary.images.forEach(base64 => {
                        const div = document.createElement('div'); div.className = "w-20 h-20 rounded-lg overflow-hidden relative border border-slate-200 flex-shrink-0";
                        div.innerHTML = `<img src="${typeof base64 === 'object' ? base64.full : base64}" class="w-full h-full object-cover">`; container.appendChild(div);
                    });
                }
            }
        }
        async function addComment(diaryId) {
            const input = document.getElementById(`input-${diaryId}`);
            const listContainer = document.getElementById(`comment-list-${diaryId}`);
            const btn = input.nextElementSibling; // 取得發送按鈕
            const icon = btn.querySelector('i');
            const text = input.value.trim();
            
            if (!text) return;
            // --- 1. 立即防呆：按鈕立刻變轉圈圈 ---
            const originalIconClass = icon.className;
            icon.className = 'fa-solid fa-circle-notch fa-spin text-xs';
            btn.disabled = true;
            input.disabled = true;
            // --- 2. 樂觀 UI：立刻在畫面上插入一個「傳送中」的假氣泡 ---
            const now = new Date();
            const timeStr = (now.getMonth() + 1).toString().padStart(2, '0') + '/' + 
                            now.getDate().toString().padStart(2, '0') + ' ' + 
                            now.getHours().toString().padStart(2, '0') + ':' + 
                            now.getMinutes().toString().padStart(2, '0');
            
            const isBoy = globalCommentAuthor === 'boy';
            const tempId = 'temp-comment-' + Date.now();
            
            const tempHtml = `
                <div id="${tempId}" class="flex ${isBoy ? '' : 'justify-end'} mb-2 comment-sending">
                    <div class="comment-bubble ${isBoy ? 'comment-boy' : 'comment-girl'}">
                        <div class="flex items-center gap-2 mb-1">
                            <i class="fa-solid ${isBoy ? 'fa-mars' : 'fa-venus'} text-[10px]"></i>
                            <span class="text-[10px] opacity-60">${timeStr}</span>
                            <span class="sending-tag"><i class="fa-solid fa-cloud-upload fa-bounce"></i> SENDING...</span>
                        </div>
                        <p class="m-0">${text}</p>
                    </div>
                </div>
            `;
            listContainer.insertAdjacentHTML('beforeend', tempHtml);
            
            // 自動捲動到底部，讓使用者看到新出的氣泡
            listContainer.parentElement.scrollTop = listContainer.parentElement.scrollHeight;

            try {
                const response = await fetch(`${API_URL}?action=add_comment&type=diary`, {
                    method: 'POST',
                    body: JSON.stringify({
                        id: diaryId,
                        author: globalCommentAuthor,
                        text: text
                    }),
                    headers: { "Content-Type": "text/plain;charset=utf-8" }
                });
                
                const result = await response.json();
                if (result.status === "success") {
                    input.value = "";
                    // --- 2. 效能優化：不要全頁 fetchData，直接局部更新該日記的留言數據 ---
                    // 重新讀取資料，但不顯示全螢幕 Loading
                    await refreshCommentsSilently(diaryId); 
                } else {
                    throw new Error(result.message);
                }
            } catch (e) {
                alert("傳送失敗");
            } finally {
                icon.className = originalIconClass;
                btn.classList.remove('opacity-50', 'pointer-events-none');
                input.disabled = false;
                input.focus();
            }
        }
        /**
         * 靜默更新：背景抓取資料並重新渲染，不干擾使用者
         */
        async function refreshCommentsSilently(diaryId) {
            // 這裡不呼叫 showLoading
            const response = await fetch(`${API_URL}?action=read&type=diary&t=${Date.now()}`);
            diaries = await response.json();
            
            // 重新渲染全部日記
            renderDiaryAll();
            
            // 渲染完後，確保視窗依然停留在剛才那則日記的位置（可選，通常瀏覽器會自動處理捲動位置）
        }
        /**
         * 局部更新特定日記的留言，避免全頁重刷的 Lag 感
         */
        async function updateSingleDiaryComments(diaryId) {
            // 雖然還是向後端抓資料，但這次我們不呼叫 showLoading(true)
            const response = await fetch(`${API_URL}?action=read&type=diary&t=${Date.now()}`);
            const data = await response.json();
            diaries = data; // 更新全域變數
            
            // 只重新渲染日記清單，但因為不經過 showLoading 畫面，體感會快非常多
            renderDiaryAll();
        }
        /**
         * 切換特定日記留言框的作者身分
         */
        function toggleCommentAuthor(diaryId, author) {
            const toggleContainer = document.getElementById(`toggle-${diaryId}`);
            const boyBtn = document.getElementById(`btn-boy-${diaryId}`);
            const girlBtn = document.getElementById(`btn-girl-${diaryId}`);
            
            // 更新資料屬性
            toggleContainer.dataset.selected = author;
            
            // 更新 UI 視覺
            if (author === 'boy') {
                boyBtn.classList.add('active');
                girlBtn.classList.remove('active');
            } else {
                girlBtn.classList.add('active');
                boyBtn.classList.remove('active');
            }
        }
        window.deleteDiary = function(id) { if(confirm('確定要刪除這篇日記嗎？')) sendData('delete', 'diary', { id: id }); };
        document.getElementById('diary-form').addEventListener('submit', function(e) {
            e.preventDefault();
            sendData(document.getElementById('diary-id').value ? 'update' : 'create', 'diary', {
                id: document.getElementById('diary-id').value || Date.now().toString(),
                date: document.getElementById('diary-date').value, content: document.getElementById('diary-content').value,
                images: currentDiaryImages, author: currentDiaryAuthor
            }, 'diary-modal');
        });

        window.onload = initMap;
        window.addEventListener('resize', () => {
            if (map && currentView === 'map') {
                map.invalidateSize();
                const controls = document.getElementById('mobile-controls');
                if (window.innerWidth < 768) controls.style.bottom = '420px'; else controls.style.bottom = '24px';
            }
        });
        // 給搜尋結果專用的新增按鈕函式
        window.openSearchSpotModal = function(lat, lng, name) {
            // 呼叫原本的新增 Modal，並傳入座標
            openModal('add', { lat: lat, lng: lng });
            
            // 自動把剛剛搜尋到的地標名稱，填入表單的「Location」欄位中
            document.getElementById('entry-name').value = name;
            
            // 移除地圖上暫時的搜尋大頭針
            if(tempSearchMarker) {
                map.removeLayer(tempSearchMarker);
                tempSearchMarker = null;
            }
        };
    </script>
</body>
</html>
